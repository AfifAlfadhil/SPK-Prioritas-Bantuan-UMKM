{% extends "base.html" %}
{% block title %}Terjadi Kesalahan ({{ code }}){% endblock %}
{% block content %}
<div class="card error-page-card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 32px 24px;">
  <h1 class="page-title" style="margin-bottom:8px;">{{ title }}</h1>
  <p class="text-muted" style="margin-bottom:18px;">{{ message }}</p>
  <p class="font-mono text-muted" style="font-size:0.8125rem; margin-bottom:24px;">Kode Status: HTTP {{ code }}</p>
  <div>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Kembali ke Beranda</a>
  </div>
</div>
{% endblock %}
